    <div class="lsp-page access-page">
  <main class="access-layout" data-builder-auth-visible="signed-out">
    <section class="access-form-panel" aria-labelledby="access-title">
      <div class="access-card">
        <div class="access-mobile-brand"><span aria-hidden="true">LSP</span><strong>Aprende LSP</strong></div>
        <h2 id="access-title">Bienvenido</h2>
        <p class="access-subtitle">Entra a tu cuenta o crea una nueva.</p>
        <div class="access-tabs" role="tablist" aria-label="Acceso">
          <button data-builder-auth-tab="login" aria-controls="login-panel" aria-selected="true" role="tab" type="button">Iniciar sesión</button>
          <button data-builder-auth-tab="signup" aria-controls="signup-panel" aria-selected="false" role="tab" tabindex="-1" type="button">Crear cuenta</button>
        </div>
        <form data-builder-auth-action="login" data-builder-auth-panel="login" class="access-form" id="login-panel" role="tabpanel">
          <label for="login-email">Correo electrónico</label><input id="login-email" name="email" type="email" autocomplete="email" placeholder="nombre@correo.com" required="">
          <label for="login-password">Contraseña</label><input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Tu contraseña" required="">
          <button class="access-submit" type="submit">Iniciar sesión</button>
          <p data-builder-auth-status="" class="access-status" aria-live="polite"></p>
        </form>
        <form data-builder-auth-action="signup" data-builder-auth-panel="signup" class="access-form" id="signup-panel" role="tabpanel" hidden="">
          <label for="signup-name">Nombre</label><input id="signup-name" name="display_name" data-builder-auth-metadata="" type="text" autocomplete="name" placeholder="Tu nombre" required="">
          <label for="signup-email">Correo electrónico</label><input id="signup-email" name="email" type="email" autocomplete="email" placeholder="nombre@correo.com" required="">
          <label for="signup-password">Contraseña</label><input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="6" placeholder="Mínimo 6 caracteres" required="">
          <fieldset class="role-choice"><legend>Quiero usar LSP para</legend><label><input name="learning_goal" data-builder-auth-metadata="" type="radio" value="learn" checked=""><span><strong>Aprender</strong><small>Practicar y guardar mi progreso</small></span></label><label><input name="learning_goal" data-builder-auth-metadata="" type="radio" value="teach"><span><strong>Enseñar</strong><small>Preparar prácticas para estudiantes</small></span></label><label><input name="learning_goal" data-builder-auth-metadata="" type="radio" value="both"><span><strong>Ambos</strong><small>Aprender y enseñar</small></span></label></fieldset>
          <p class="teacher-note">El acceso docente requiere aprobación del administrador.</p>
          <button class="access-submit" type="submit">Crear mi cuenta</button>
          <p data-builder-auth-status="" class="access-status" aria-live="polite"></p>
        </form>
        <div class="access-guest"><span>o</span><button data-builder-flow-action="navigate" data-builder-flow-target="catalogo" type="button">Continuar como invitado</button><small>Podrás practicar sin guardar resultados.</small></div>
        <p class="access-footnote">La cámara se solicitará únicamente al comenzar una práctica.</p>
      </div>
    </section>
  </main>
</div>
